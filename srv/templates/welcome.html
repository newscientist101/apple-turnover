<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strudel Agent</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <!-- Top Region: Single-Line Agent Message Panel -->
      <section class="agent-panel" id="agent-panel">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">LIVE</span>
        </div>
        <div class="agent-message" id="agent-message">
          System initialized. Awaiting agent input...
        </div>
      </section>

      <!-- Main Workspace Split: Canvas (Left) and Code Editor (Right) -->
      <div class="workspace">
        <!-- Left Region: Visualization Canvas -->
        <section class="canvas-region" id="canvas-region">
          <canvas id="canvas"></canvas>
        </section>

        <!-- Right Region: Live Code Editor -->
        <section class="editor-region" id="editor-region">
          <textarea id="editor" placeholder="// Live code editor..." spellcheck="false"></textarea>
        </section>
      </div>
    </main>
  </body>
</html>
