<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strudel Agent</title>
    <link rel="stylesheet" href="/static/style.css" />
    <!-- CodeMirror 5.65.16 (pinned): live code view. Pure CDN includes, no
         npm/Vite build step, matching the @strudel/web include below. If the
         CDN is unreachable, editor.js falls back to the plain textarea. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css" />
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.js"></script>
    <script src="https://unpkg.com/@strudel/web@1.3.0"></script>
    <script>window.strudelInitPromise = window.initStrudel();</script>
    <script src="/static/session.js" defer></script>
    <script src="/static/editor.js" defer></script>
    <script src="/static/viz.js" defer></script>
    <script src="/static/sync.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <!-- Top Region: Single-Line Agent Message Panel -->
      <section class="agent-panel" id="agent-panel">
        <!-- Agent presence. The state class (agent-connected / agent-absent /
             agent-never) is written by session.js from snapshot.agent, and the
             dot only pulses while an agent is actually connected. The initial
             text says NEVER rather than LIVE: this server has, by definition,
             not seen an agent yet, so any confident "live" claim here would be
             decoration reporting a state nothing observed. -->
        <div class="status-indicator agent-never" id="status-indicator" role="status">
          <span class="status-dot" id="agent-status-dot"></span>
          <span class="status-text" id="agent-status-text" aria-live="polite">AGENT NEVER</span>
        </div>
        <div class="agent-message" id="agent-message">
          System initialized. Awaiting agent input...
        </div>
        <div class="sync-status" id="sync-status" aria-live="polite"></div>
        <button id="play-btn" class="play-btn" aria-label="Play/Pause Audio">Play</button>
        <span id="samples-status" class="samples-status" role="status" aria-live="polite">Samples: Loading…</span>
        <p id="samples-error" class="samples-error" role="alert"></p>
        <button id="samples-retry" class="samples-retry" hidden>Retry</button>
      </section>

      <!-- Main Workspace Split: Canvas (Left) and Code Editor (Right) -->
      <div class="workspace">
        <!-- Left Region: Visualization Canvas -->
        <section class="canvas-region" id="canvas-region">
          <canvas id="canvas"></canvas>
        </section>

        <!-- Right Region: Live Code Editor -->
        <section class="editor-region" id="editor-region">
          <div class="editor-status" id="editor-status" aria-live="polite"></div>
          <textarea id="editor" placeholder="// Live code editor..." spellcheck="false" readonly aria-readonly="true" aria-label="Live performance code (read-only)"></textarea>
        </section>
      </div>
    </main>
     <script>
       // Automatic sample loading (strudel-agent-8f0): the dirt-samples pack
       // is fetched once at startup, not on a button click. The old
       // #sample-toggle-btn toggle is gone on purpose — its off branch only
       // relabelled the button while the pack stayed in the registry, so no
       // control may imply the pack can be unloaded. The only remaining
       // control is #samples-retry, a recovery path shown only after failure.
       let replInstance = null;
       let samplesLoaded = false;
       let samplesLoading = false;

       function samplesMessage(err) {
         return (err && err.message) || String(err);
       }

       // The single visible failure sink: every rejection path funnels
       // through here, so a failed load is always rendered in the page and
       // never only a console.warn. Loading vs failed is unambiguous: loading
       // leaves #samples-error empty, failure writes it.
       function showSamplesFailure(msg) {
         var statusEl = document.getElementById('samples-status');
         var errorEl = document.getElementById('samples-error');
         var retryEl = document.getElementById('samples-retry');
         if (statusEl) { statusEl.textContent = 'Samples: Error'; }
         if (errorEl) { errorEl.textContent = msg; }
         if (retryEl) { retryEl.hidden = false; }
       }

       function showSamplesSuccess() {
         var statusEl = document.getElementById('samples-status');
         var errorEl = document.getElementById('samples-error');
         var retryEl = document.getElementById('samples-retry');
         samplesLoaded = true;
         samplesLoading = false;
         if (statusEl) { statusEl.textContent = 'Samples: On'; }
         if (errorEl) { errorEl.textContent = ''; }
         if (retryEl) { retryEl.hidden = true; }
       }

       // Exactly one automatic attempt; further attempts happen only via
       // explicit #samples-retry clicks. The guard drops concurrent and
       // duplicate invocations, so no double-load.
       function loadSamplePack() {
         if (samplesLoading || samplesLoaded) return;
         samplesLoading = true;
         var statusEl = document.getElementById('samples-status');
         if (statusEl) { statusEl.textContent = 'Samples: Loading…'; }
         const samplesFn = window.samples || (window.strudel && window.strudel.samples);
         let loadPromise;
         if (samplesFn) {
           loadPromise = samplesFn('github:tidalcycles/dirt-samples');
         } else if (replInstance && replInstance.evaluate) {
           loadPromise = replInstance.evaluate('samples("github:tidalcycles/dirt-samples")');
         } else {
           loadPromise = Promise.reject(new Error('Samples function unavailable'));
         }
         loadPromise
           .then(function () {
             showSamplesSuccess();
           })
           .catch(function (err) {
             console.warn('Failed to load sample pack:', err);
             samplesLoading = false;
             showSamplesFailure('Could not load the sample pack github:tidalcycles/dirt-samples: ' + samplesMessage(err) + '. Sound stays synth-only; patterns naming dirt samples will report samplesResolved:false.');
           });
       }

       // Single merged init handler: assigning replInstance and starting the
       // auto-load in the same .then removes the registration-order fragility
       // that caused the pre-init click race. A missing bundle (script tag
       // failed, so the promise is undefined) or a rejected init fails
       // loudly with a bundle-specific message; the page never sits on
       // Loading forever and never throws.
       if (window.strudelInitPromise && window.strudelInitPromise.then) {
         window.strudelInitPromise.then(function(repl) {
           replInstance = repl;
           window.repl = repl;
           loadSamplePack();
         }, function (err) {
           samplesLoading = false;
           showSamplesFailure('Could not start Strudel, so samples were not loaded: ' + samplesMessage(err) + '. Sound and verdicts are unavailable until the bundle loads.');
         });
       } else {
         showSamplesFailure('Could not start Strudel, so samples were not loaded: initialisation did not run. Sound and verdicts are unavailable until the bundle loads.');
       }

       // The retry control is wired immediately: this script sits at the
       // end of <body>, so #samples-retry already exists. (The null guard
       // stays for safety.) Retry calls the same guarded loadSamplePack, so
       // it is a no-op while loading or after success.
       var samplesRetryBtn = document.getElementById('samples-retry');
       if (samplesRetryBtn) {
         samplesRetryBtn.addEventListener('click', function () {
           loadSamplePack();
         });
       }

       // Wait for DOM to be ready (script is deferred, but double-check)
       document.addEventListener('DOMContentLoaded', function () {
         var playBtn = document.getElementById('play-btn');
         if (playBtn) {
           playBtn.addEventListener('click', function () {
             // Get current desired state from session.js and toggle
             var current = window.strudelSession.getCurrentPlayingState();
             window.strudelSession.requestPlayPause(!current);
           });
         }
       });
     </script>
   </body>
 </html>
