<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strudel Agent</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://unpkg.com/@strudel/web@1.3.0"></script>
  </head>
  <body>
    <main class="app-shell">
      <!-- Top Region: Single-Line Agent Message Panel -->
      <section class="agent-panel" id="agent-panel">
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">LIVE</span>
        </div>
        <div class="agent-message" id="agent-message">
          System initialized. Awaiting agent input...
        </div>
        <button id="play-btn" class="play-btn" aria-label="Play/Pause Audio">Play</button>
      </section>

      <!-- Main Workspace Split: Canvas (Left) and Code Editor (Right) -->
      <div class="workspace">
        <!-- Left Region: Visualization Canvas -->
        <section class="canvas-region" id="canvas-region">
          <canvas id="canvas"></canvas>
        </section>

        <!-- Right Region: Live Code Editor -->
        <section class="editor-region" id="editor-region">
          <textarea id="editor" placeholder="// Live code editor..." spellcheck="false"></textarea>
        </section>
      </div>
    </main>
    <script>
      (function() {
        let replInstance = null;
        let isPlaying = false;

        const playBtn = document.getElementById('play-btn');

        function updateButtonUI(playing) {
          isPlaying = playing;
          if (playBtn) {
            playBtn.textContent = isPlaying ? 'Pause' : 'Play';
            if (isPlaying) {
              playBtn.classList.add('playing');
            } else {
              playBtn.classList.remove('playing');
            }
          }
        }

        window.strudelInitPromise = window.initStrudel()
          .then(function(repl) {
            replInstance = repl;
            window.repl = repl;
            return repl;
          })
          .catch(function(err) {
            console.error('Failed to initialize Strudel:', err);
          });

        if (playBtn) {
          playBtn.addEventListener('click', function() {
            if (!replInstance) return;

            if (isPlaying) {
              try {
                replInstance.stop();
              } catch (e) {
                console.warn('Error stopping REPL:', e);
              }
              updateButtonUI(false);
            } else {
              try {
                replInstance.start();
              } catch (e) {
                console.warn('Error starting REPL:', e);
              }
              updateButtonUI(true);
            }
          });
        }
      })();
    </script>
  </body>
</html>
